project:
  type: website
  output-dir: docs
  resources:
    - img/**
website:
  search:
    location: navbar
    type: overlay
  navbar:
    left:
      - text: "home"
        href: index.qmd
      - text: "cv"
        href: cv.qmd
      - text: "materials"
        href: open-materials.qmd
      - text: "contact"
        href: contact.qmd
    # Right side: just the icons, shown before the search lens.
    # Remove "text:" from an item to show only its symbol.
    right:
      - icon: github
        href: https://github.com/mar-cald
        target: _blank
        aria-label: "GitHub"
      - icon: gitlab
        href: https://gitlab.pavlovia.org/mar.cald
        target: _blank
        aria-label: "GitLab"
      - icon: file-text
        href: https://www.researchgate.net/profile/Margherita-Calderan-2
        target: _blank
        aria-label: "ResearchGate"
      - icon: flower2
        href: https://osf.io/user/5ca9t?tab=2
        target: _blank
        aria-label: "OSF"
      # The ORCID symbol is drawn by styles.css (search for "orcid"),
      # the icon named here is only a fallback.
      - icon: person-circle
        href: https://orcid.org/0009-0005-5668-5162
        target: _blank
        aria-label: "ORCID"
format:
  html:
    # default = clean base theme; brand = colours + fonts from _brand.yml
    # (theme names must be lowercase)
    theme: [default, brand]
    fontsize: 1.1em      # text size: make bigger/smaller here
    linestretch: 1.6     # space between lines
    css: styles.css
    toc: true
    smooth-scroll: true
    include-in-header:
       text: |
         <link rel="shortcut icon" href="img/daisy.png"/>
         <meta name="google-site-verification" content="Iier_KnAUnnOvH-tUDRqSenivLnqlFEG0mH-9FH1jdg" />
