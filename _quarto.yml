project:
  type: website
  output-dir: docs
  resources:
    - img/**
website:
  search:
    location: navbar
    type: overlay
  navbar:
    left:
      - text: "home"
        href: index.qmd
      - text: "cv"
        href: cv.qmd
      - text: "materials"
        href: open-materials.qmd
      - text: "contact"
        href: contact.qmd
format:
  html:
    # default = clean base theme; brand = colours + fonts from _brand.yml
    # (theme names must be lowercase)
    theme: [default, brand]
    fontsize: 1.1em      # text size: make bigger/smaller here
    linestretch: 1.6     # space between lines
    css: styles.css
    toc: true
    smooth-scroll: true
    include-in-header:
       text: |
         <link rel="shortcut icon" href="img/daisy.png"/>
         <meta name="google-site-verification" content="Iier_KnAUnnOvH-tUDRqSenivLnqlFEG0mH-9FH1jdg" />
