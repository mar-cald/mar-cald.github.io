<!--
  Power Rangers row, shown at the bottom of the home page.
  The styling (size, glow, name bubble) is in styles.css, section 5.

  Each Ranger is one <a> ... </a> block:
    href          -> the page that opens when you click it
    data-bubble   -> the name shown in the bubble on hover
    --figurina-img -> the picture
    --glow-color  -> the colour of the glow on hover
  To add a Ranger, copy one block; to remove one, delete its block.
-->

<div class="rangers">

  <a class="figurina-wrap" href="https://filippogambarota.github.io/" target="_blank"
     data-bubble="Filippo Gambarota"
     style="--figurina-img: url('img/power-rangers/black.png');
            --glow-color: rgba(0, 0, 0, 0.95);">
    <div class="figurina"></div>
  </a>

  <a class="figurina-wrap" href="https://mar-cald.github.io/" target="_blank"
     data-bubble="Margherita Calderan"
     style="--figurina-img: url('img/power-rangers/purple.png');
            --glow-color: rgba(200, 0, 255, 0.95);">
    <div class="figurina"></div>
  </a>

  <a class="figurina-wrap" href="https://enricotoffalini.github.io/" target="_blank"
     data-bubble="Enrico Toffalini"
     style="--figurina-img: url('img/power-rangers/red.png');
            --glow-color: rgba(220, 0, 0, 0.95);">
    <div class="figurina"></div>
  </a>

  <a class="figurina-wrap" href="https://feracotommaso.github.io/" target="_blank"
     data-bubble="Tommaso Feraco"
     style="--figurina-img: url('img/power-rangers/green.png');
            --glow-color: rgba(100, 150, 50, 0.95);">
    <div class="figurina"></div>
  </a>

</div>
